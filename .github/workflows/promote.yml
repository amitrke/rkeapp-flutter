name: Promote to production

# Sends a build that testers already have to production: Play's internal
# testing track to production, and TestFlight to App Review (released
# automatically once Apple approves it). Nothing is built, so what ships is the
# binary that was tested. Release notes come from fastlane/metadata. Setup (the
# "production" environment) is in docs/RELEASING.md.
#
# Every job that talks to a store runs in the "production" environment, so a
# run waits for approval before it can change anything.
on:
  workflow_dispatch:
    inputs:
      build:
        description: >-
          Build number to promote: the number in brackets in TestFlight and
          Play Console, e.g. 145 for "1.0.1 (145)".
        type: string
        required: true
      platforms:
        description: Which stores this run changes.
        type: choice
        options: [both, android, ios]
        default: both
      rollout:
        description: >-
          Percentage of Play users who get the release at first. Run again
          with a higher number (100 completes it) to widen a staged rollout.
        type: string
        default: '100'

concurrency:
  group: promote
  cancel-in-progress: false

permissions:
  contents: read

env:
  RUBY_VERSION: '3.3'

jobs:
  check:
    name: Check the request
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.version.outputs.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the version and inputs
        id: version
        env:
          BUILD: ${{ inputs.build }}
          ROLLOUT: ${{ inputs.rollout }}
        run: |
          name="$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)"
          if ! [[ "$name" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::pubspec.yaml's version '$name' is not of the form 1.2.3"
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          # Production gets only what has been merged to master.
          if [ "$GITHUB_REF" != refs/heads/master ]; then
            echo "::error::Run this from master (merge develop into master first), not $GITHUB_REF_NAME."
            exit 1
          fi
          if ! [[ "$BUILD" =~ ^[0-9]+$ ]]; then
            echo "::error::Give the build number testers have, e.g. 145 for \"$name (145)\"."
            exit 1
          fi
          if ! [[ "$ROLLOUT" =~ ^[0-9]+$ ]] || [ "$ROLLOUT" -lt 1 ] || [ "$ROLLOUT" -gt 100 ]; then
            echo "::error::rollout must be a whole percentage from 1 to 100, not '$ROLLOUT'."
            exit 1
          fi
          # A re-run after one store failed finds its own tag, which is fine.
          tagged="$(git rev-parse -q --verify "refs/tags/v$name^{commit}" || true)"
          if [ -n "$tagged" ] && [ "$tagged" != "$GITHUB_SHA" ]; then
            echo "::error::v$name is already released from another commit. Bump pubspec.yaml's version."
            exit 1
          fi
          echo "Promote $name ($BUILD)"

  android:
    name: Google Play
    needs: check
    if: inputs.platforms != 'ios'
    runs-on: ubuntu-latest
    environment: production
    env:
      BUILD: ${{ inputs.build }}
      ROLLOUT: ${{ inputs.rollout }}
    steps:
      - uses: actions/checkout@v4
      # Pinned to a commit (v1.328.0): this job is handed a service-account key.
      - uses: ruby/setup-ruby@e81a8fa391b11a595c1b7ed84177cc0fe02faf83
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true

      # Written outside the checkout and removed at the end whatever happens.
      - name: Install the Play key
        env:
          # The same key release.yml uploads test builds with: its service
          # account can also release to production.
          KEY: ${{ secrets.PLAYSTORE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::PLAYSTORE_SERVICE_ACCOUNT_JSON is not set. See docs/RELEASING.md."
            exit 1
          fi
          key="$RUNNER_TEMP/play.json"
          printf '%s' "$KEY" > "$key"
          chmod 600 "$key"
          echo "SUPPLY_JSON_KEY=$key" >> "$GITHUB_ENV"

      - name: Promote to production
        run: bundle exec fastlane android promote build:"$BUILD" rollout:"$ROLLOUT"

      - name: Remove the Play key
        if: always()
        run: rm -f "$RUNNER_TEMP/play.json"

  ios:
    name: App Store
    needs: check
    if: inputs.platforms != 'android'
    # deliver uploads no binary here, so it needs no Xcode.
    runs-on: ubuntu-latest
    environment: production
    env:
      BUILD: ${{ inputs.build }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@e81a8fa391b11a595c1b7ed84177cc0fe02faf83
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true

      - name: Check the App Store Connect key is set
        run: |
          for name in APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_API_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set. See docs/RELEASING.md."
              exit 1
            fi
          done

      - name: Submit for review
        run: bundle exec fastlane ios promote build:"$BUILD"

  tag:
    name: Tag the release
    needs: [check, android, ios]
    # Tags once every store this run covered has succeeded. A skipped store is
    # fine; a failed one means fixing it and running again first.
    if: >-
      always()
      && needs.check.result == 'success'
      && !contains(needs.*.result, 'failure')
      && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # Pushed with GITHUB_TOKEN, so it does not start release.yml and no new
      # test build replaces the one just promoted.
      - name: Tag v${{ needs.check.outputs.name }}
        env:
          NAME: ${{ needs.check.outputs.name }}
          BUILD: ${{ inputs.build }}
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v$NAME" >/dev/null 2>&1; then
            echo "v$NAME already exists."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$NAME" -m "Roorkee $NAME ($BUILD), promoted to production ($PLATFORMS)"
          git push origin "v$NAME"
