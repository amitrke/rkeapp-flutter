appId: org.roorkee
env:
  SCREENSHOT_DIR: ${MAESTRO_SCREENSHOT_DIR}
---
# Read-only screenshot capture for primary app surfaces.
# Output lands in screenshots/{device-id}/ via MAESTRO_SCREENSHOT_DIR.

- launchApp:
    clearState: false

- extendedWaitUntil:
    visible: "Welcome to Roorkee"
    timeout: 30000
- takeScreenshot: ${SCREENSHOT_DIR}/01_home_hero

- scroll
- takeScreenshot: ${SCREENSHOT_DIR}/02_home_feed

- tapOn:
    text: "Open navigation menu"
- extendedWaitUntil:
    visible: "Contact"
    timeout: 8000
- takeScreenshot: ${SCREENSHOT_DIR}/03_drawer

- tapOn: "Account"
- extendedWaitUntil:
    visible: "Account"
    timeout: 8000
- takeScreenshot: ${SCREENSHOT_DIR}/04_account

- tapOn:
    text: "Open navigation menu"
- tapOn: "Gallery"
- extendedWaitUntil:
    visible: "Gallery"
    timeout: 8000
- takeScreenshot: ${SCREENSHOT_DIR}/05_gallery

- tapOn:
    text: "Open navigation menu"
- tapOn: "Weather"
- extendedWaitUntil:
    visible: "Weather"
    timeout: 8000
- takeScreenshot: ${SCREENSHOT_DIR}/06_weather

- tapOn:
    text: "Open navigation menu"
- tapOn: "Contact"
- extendedWaitUntil:
    visible: "Contact Us"
    timeout: 8000
- takeScreenshot: ${SCREENSHOT_DIR}/07_contact

- stopApp
